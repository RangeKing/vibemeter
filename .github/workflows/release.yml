name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches every application version
        run: |
          APP_VERSION="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          DESKTOP_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          CARGO_VERSION="$(awk -F ' *= *' '$1 == "version" { gsub(/\"/, "", $2); print $2; exit }' apps/desktop/src-tauri/Cargo.toml)"
          if [ "$RELEASE_TAG" != "v$APP_VERSION" ]; then
            echo "Release tag $RELEASE_TAG must match tauri.conf.json version v$APP_VERSION."
            exit 1
          fi
          if [ "$ROOT_VERSION" != "$APP_VERSION" ] || [ "$DESKTOP_VERSION" != "$APP_VERSION" ] || [ "$CARGO_VERSION" != "$APP_VERSION" ]; then
            echo "package.json, desktop package.json, Cargo.toml, and tauri.conf.json versions must all match $APP_VERSION."
            exit 1
          fi

      - name: Run validation suite
        run: npm run ci

  build-and-release:
    name: Build ${{ matrix.label }}
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            target: aarch64-apple-darwin
            archive: arm64
          - label: Intel
            target: x86_64-apple-darwin
            archive: x64
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build app for ZIP
        run: npm run tauri --workspace @vibemeter/desktop -- build --target ${{ matrix.target }} --bundles app

      - name: Package app as ZIP
        env:
          APP_PATH: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/VibeMeter.app
          ZIP_PATH: VibeMeter_${{ env.RELEASE_TAG }}_macOS_${{ matrix.archive }}.zip
        run: ditto -c -k --keepParent --sequesterRsrc "$APP_PATH" "$ZIP_PATH"

      - name: Build DMG and create GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --bundles dmg
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: VibeMeter ${{ env.RELEASE_TAG }}
          releaseBody: Download the DMG or ZIP matching your Mac. Apple Silicon is for M-series Macs; Intel is for Intel-based Macs. Builds are ad-hoc signed and are not notarized.
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generateReleaseNotes: true
          releaseAssetNamePattern: VibeMeter_[version]_macOS_[arch].[ext]
          retryAttempts: 2

      - name: Upload ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP_PATH: VibeMeter_${{ env.RELEASE_TAG }}_macOS_${{ matrix.archive }}.zip
        run: gh release upload "$RELEASE_TAG" "$ZIP_PATH" --clobber
