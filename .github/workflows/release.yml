name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.4.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Refresh official API pricing
        run: npm run pricing:update

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches every application version
        run: |
          APP_VERSION="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          DESKTOP_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          CARGO_VERSION="$(awk -F ' *= *' '$1 == "version" { gsub(/\"/, "", $2); print $2; exit }' apps/desktop/src-tauri/Cargo.toml)"
          if [ "$RELEASE_TAG" != "v$APP_VERSION" ]; then
            echo "Release tag $RELEASE_TAG must match tauri.conf.json version v$APP_VERSION."
            exit 1
          fi
          if [ "$ROOT_VERSION" != "$APP_VERSION" ] || [ "$DESKTOP_VERSION" != "$APP_VERSION" ] || [ "$CARGO_VERSION" != "$APP_VERSION" ]; then
            echo "package.json, desktop package.json, Cargo.toml, and tauri.conf.json versions must all match $APP_VERSION."
            exit 1
          fi

      - name: Run validation suite
        run: npm run ci

  build-and-release:
    name: Build ${{ matrix.label }}
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            target: aarch64-apple-darwin
            archive: arm64
            dmg_arch: aarch64
          - label: Intel
            target: x86_64-apple-darwin
            archive: x64
            dmg_arch: x64
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Refresh official API pricing
        run: npm run pricing:update

      - name: Install dependencies
        run: npm ci

      - name: Build app for ZIP
        run: npm run tauri --workspace @vibemeter/desktop -- build --target ${{ matrix.target }} --bundles app

      - name: Package app as ZIP
        env:
          APP_PATH: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/VibeMeter.app
          ZIP_PATH: VibeMeter_${{ env.RELEASE_TAG }}_macOS_${{ matrix.archive }}.zip
        run: ditto -c -k --keepParent --sequesterRsrc "$APP_PATH" "$ZIP_PATH"

      - name: Build DMG and create GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --bundles dmg
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: VibeMeter ${{ env.RELEASE_TAG }}
          releaseBody: Download the DMG or ZIP matching your Mac. Apple Silicon is for M-series Macs; Intel is for Intel-based Macs. Builds are ad-hoc signed and are not notarized.
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generateReleaseNotes: true
          releaseAssetNamePattern: VibeMeter_[version]_macOS_[arch].[ext]
          retryAttempts: 2

      - name: Hide DMG support files
        run: |
          python3 -m venv "$RUNNER_TEMP/vibemeter-dmg-venv"
          source "$RUNNER_TEMP/vibemeter-dmg-venv/bin/activate"
          python -m pip install --disable-pip-version-check -r scripts/requirements-dmg.txt
          APP_VERSION="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          DMG_ASSET_NAME="VibeMeter_${APP_VERSION}_macOS_${{ matrix.dmg_arch }}.dmg"
          DMG_PATH="$(find "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle" -type f -name '*.dmg' ! -name 'rw.*' -print -quit)"
          if [ -z "$DMG_PATH" ]; then
            echo "Tauri did not produce a DMG for ${{ matrix.target }}."
            exit 1
          fi
          bash scripts/finalize-dmg.sh "$DMG_PATH"
          bash scripts/check-dmg-layout.sh "$DMG_PATH"
          ditto "$DMG_PATH" "$DMG_ASSET_NAME"
          echo "DMG_ASSET_PATH=$DMG_ASSET_NAME" >> "$GITHUB_ENV"

      - name: Replace release DMG with finalized layout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" "$DMG_ASSET_PATH" --clobber

      - name: Upload ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP_PATH: VibeMeter_${{ env.RELEASE_TAG }}_macOS_${{ matrix.archive }}.zip
        run: gh release upload "$RELEASE_TAG" "$ZIP_PATH" --clobber

  notify-website:
    name: Notify product website
    needs: build-and-release
    if: ${{ needs.build-and-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Confirm all website download assets are ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in {1..12}; do
            ASSET_NAMES="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            missing=0
            for pattern in \
              '_macOS_aarch64\.dmg$' \
              '_macOS_arm64\.zip$' \
              '_macOS_x64\.dmg$' \
              '_macOS_x64\.zip$'; do
              if ! grep -Eq "$pattern" <<< "$ASSET_NAMES"; then
                missing=1
              fi
            done
            if [ "$missing" -eq 0 ]; then
              echo "All four website download assets are ready for $RELEASE_TAG."
              exit 0
            fi
            echo "Waiting for release assets ($attempt/12)..."
            sleep 10
          done
          echo "The release is missing one or more required macOS assets."
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          exit 1

      - name: Dispatch release to website repository
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "WEBSITE_DISPATCH_TOKEN is not configured."
            exit 1
          fi
          gh api \
            --method POST \
            repos/RangeKing/vibemeter-website/dispatches \
            -f event_type='vibemeter-release-published' \
            -F "client_payload[tag]=$RELEASE_TAG"
