name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Check frontend and localization
        run: npm run check

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build --workspace @aftervibe/desktop

      - name: Check Rust formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test
