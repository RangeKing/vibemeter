[package]
name = "aftervibe"
version = "0.1.0"
description = "Review the work behind the vibe."
authors = ["aftervibe"]
edition = "2024"
license = "MIT"

[lib]
name = "aftervibe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
hex = "0.4"
once_cell = "1"
portable-pty = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "socks"] }
resvg = "0.45"
rusqlite = { version = "0.38", features = ["bundled", "chrono", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
