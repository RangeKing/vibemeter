[package]
name = "vibemeter"
version = "0.3.2"
description = "Track your agents. Discover your coding type."
authors = ["VibeMeter"]
edition = "2024"
license = "MIT"
repository = "https://github.com/RangeKing/vibemeter"
homepage = "https://github.com/RangeKing/vibemeter"

[lib]
name = "vibemeter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
hex = "0.4"
jieba-rs = "0.10.3"
once_cell = "1"
portable-pty = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "socks"] }
resvg = "0.45"
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled", "chrono", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", features = ["NSEvent", "NSRunningApplication", "NSScreen", "NSWindow", "NSWorkspace"] }
objc2-foundation = "0.3.2"
security-framework = "3.7"
security-framework-sys = "2.17"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }

[dev-dependencies]
tempfile = "3"
